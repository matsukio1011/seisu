    // =========================================================================
    // CARD SELECTION & DOPA CELEBRATION LOGIC
    // =========================================================================
    function selectCardChoice(cardIdx, choice, btnEl = null) {
      if (state.graded) return;

      DopaAudio.init();

      if (state.choices[cardIdx] === choice) {
        state.choices[cardIdx] = null;
        if (state.dopaMode) DopaAudio.tap(0);
      } else {
        const wasNull = state.choices[cardIdx] === null;
        state.choices[cardIdx] = choice;
        const answeredSoFar = state.choices.filter(c => c !== null).length;
        if (state.dopaMode) {
          DopaAudio.tap(answeredSoFar);
          if (wasNull && answeredSoFar < 6) {
            addHype(2);
          }
          if (btnEl && fxEngine) {
            const rect = btnEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            fxEngine.burst(cx, cy, {
              count: 14 + state.level * 2,
              power: 6.5 + state.level * 0.3,
              shapes: state.level >= 4 ? ['confetti', 'star', 'spark', 'coin'] : ['confetti', 'star', 'spark'],
              sizeMul: 0.78 + state.level * 0.04
            });
            fxEngine.ring(cx, cy, {
              color: choice === 'O' ? '#3b6bff' : '#ff4f6d',
              maxR: 90 + state.level * 10,
              width: 6 + state.level * 0.5,
              speed: 0.07
            });
          }
          const cheers = ['いいぞ！', 'ナイス！', 'その調子！', 'キラッ✨', 'ポン♪', 'バッチリ！'];
          if (answeredSoFar < 6) {
            mascot.react('happy');
            mascot.say(`${answeredSoFar}/6 ${cheers[answeredSoFar % cheers.length]}`, 900);
          }
        }
      }

      const answeredCount = state.choices.filter(c => c !== null).length;
      if (answeredCount === 6) {
        state.graded = true;
        let roundCorrect = 0;
        state.cards.forEach((card, i) => {
          const expected = card.isCorrect ? 'O' : 'X';
          if (state.choices[i] === expected) roundCorrect++;
        });
        state.totalCorrect += roundCorrect;
        state.totalAnswered += 6;

        if (roundCorrect === 6) {
          state.perfectStreak += 1;
          state.combo += 1;
          const gained = (600 + state.combo * 150) * (1 + Math.floor(state.level / 2));
          state.dopaPts += gained;

          if (state.dopaMode) {
            DopaAudio.correct(state.combo);
            if (state.combo >= 2) DopaAudio.combo(state.combo);
            addHype(16 + Math.min(state.combo * 3, 20));
          } else {
            playTone('perfect');
          }

          renderAll();

          if (state.dopaMode) {
            updateDopaHud();
            bumpDopaComboBadge();

            if (bgEngine) {
              bgEngine.pulse(0.45 + state.level * 0.05, 0.08);
              bgEngine.setReach(state.perfectStreak === state.targetStreak - 1);
            }

            // Burst particles on all 6 cards!
            state.cards.forEach((_, idx) => {
              const cardEl = document.getElementById(`card-${idx}`);
              if (cardEl && fxEngine) {
                const r = cardEl.getBoundingClientRect();
                const x = r.left + r.width / 2;
                const y = r.top + r.height / 2;
                const shapes = ['confetti', 'star', 'spark'];
                if (state.level >= 2) shapes.push('coin');
                if (state.level >= 4) shapes.push('heart');
                if (state.level >= 6) shapes.push('mini');
                if (state.level >= 8) shapes.push('digit');
                fxEngine.burst(x, y, {
                  count: 18 + state.level * 3,
                  power: 9 + state.level * 0.5,
                  shapes,
                  sizeMul: 0.9 + state.level * 0.04
                });
              }
            });

            if (fxEngine) {
              const cx = window.innerWidth / 2;
              const cy = window.innerHeight / 2;
              fxEngine.ring(cx, cy, { color: '#ffd23f', maxR: 380 + state.level * 25, width: 14, speed: 0.045 });
              fxEngine.popText(cx, cy - 30, `+${gained} PT!`, { color: '#ffd23f', size: 42 });
              if (state.combo >= 2 || state.level >= 3) {
                fxEngine.launchStreamers('both', 10 + Math.min(state.combo * 2 + state.level * 2, 24));
              }
              if (state.combo >= 2 || state.level >= 4) {
                fxEngine.launchFireworks(2 + Math.min(5, Math.floor((state.combo + state.level) / 2)));
              }
              if (state.level >= 5) {
                fxEngine.rain(30 + state.level * 5, ['confetti', 'star', 'coin', 'heart']);
              }
            }

            const slamWords = ['PERFECT!!', 'パーフェクト!!', '全問正解!!', 'てんさい!!', '神ワザ!!', '最高!!'];
            slam(slamWords[(state.combo - 1) % slamWords.length], PALETTE[state.combo % PALETTE.length]);
            flashScreen('rgba(255, 230, 120, 0.55)');
            shakeStage(state.level >= 5 ? 'big' : 'hit');

            if (state.perfectStreak === state.targetStreak - 1) {
              cutin('リーチ!!', `あと1回で${state.targetStreak}連続合格🏆`, 'linear-gradient(90deg,#ffd23f,#ff7ab6,#3fdcb0)');
              mascot.react('super');
              mascot.say('次で合格リーチだよ！！🔥', 2000);
            } else if (state.combo >= 2) {
              cutin(`${state.combo} 連続PERFECT!!`, `+${gained} PT ゲット！`);
              mascot.react('super');
              mascot.say(`${state.combo}連続パーフェクト！最高〜！`, 1500);
            } else {
              mascot.react('happy');
              mascot.say('6問ぜんぶ大正解！！🎉', 1400);
            }
          }

          if (state.perfectStreak >= state.targetStreak && state.perfectStreak % state.targetStreak === 0) {
            state.autoNextTimer = setTimeout(() => {
              showPassModal();
            }, 750);
          } else {
            const prog = document.getElementById('autoNextProgress');
            if (prog) {
              prog.className = 'absolute bottom-0 left-0 h-1 bg-emerald-500 auto-next-bar';
            }
            state.autoNextTimer = setTimeout(() => {
              sampleProblemsForHand();
            }, state.dopaMode ? 1250 : 1050);
          }
          return;
        } else {
          // Missed at least one card
          state.perfectStreak = 0;
          state.combo = 0;
          if (state.dopaMode) {
            DopaAudio.wrong();
            if (roundCorrect >= 4) {
              addHype(4);
            }
            updateDopaHud();
            if (bgEngine) bgEngine.setReach(false);
            mascot.react('sad');
            mascot.say(`おしい！${roundCorrect}/6 正解！ヒントを見てみよう💡`, 2200);
            state.cards.forEach((card, idx) => {
              const expected = card.isCorrect ? 'O' : 'X';
              const cardEl = document.getElementById(`card-${idx}`);
              if (!cardEl || !fxEngine) return;
              const r = cardEl.getBoundingClientRect();
              const x = r.left + r.width / 2;
              const y = r.top + r.height / 2;
              if (state.choices[idx] === expected) {
                fxEngine.burst(x, y, { count: 12, power: 6, shapes: ['star', 'confetti'], sizeMul: 0.75 });
              } else {
                fxEngine.puff(x, y);
              }
            });
          } else {
            playTone('fail');
          }
        }
      }

      renderAll();
    }

    function resetCurrentChoices() {
      clearAutoNextTimer();
      state.choices = [null, null, null, null, null, null];
      state.graded = false;
      renderAll();
    }

    // =========================================================================
    // UI RENDERING (THEMES, STATUS BANNER, 6 CARDS)
    // =========================================================================
    function applyThemeClasses() {
      const dk = state.darkMode && !state.dopaMode;
      const body = document.getElementById('appBody');
      const header = document.getElementById('appHeader');
      const title = document.getElementById('appTitle');
      const poolBadge = document.getElementById('poolCountBadge');
      const modeGroup = document.getElementById('modeGroup');
      const coefGroup = document.getElementById('coefGroup');
      const targetGroup = document.getElementById('targetGroup');
      const typeFilterBar = document.getElementById('typeFilterBar');
      const expandTypeWrap = document.getElementById('expandTypeWrap');
      const factorTypeWrap = document.getElementById('factorTypeWrap');
      const expandTypeGroup = document.getElementById('expandTypeGroup');
      const factorTypeGroup = document.getElementById('factorTypeGroup');
      const expandTypeLabel = document.getElementById('expandTypeLabel');
      const factorTypeLabel = document.getElementById('factorTypeLabel');
      const retryBtn = document.getElementById('retrySameBtn');
      const soundBtn = document.getElementById('soundToggleBtn');
      const darkBtn = document.getElementById('darkModeBtn');
      const fullBtn = document.getElementById('fullscreenBtn');
      const dopaBtn = document.getElementById('dopaModeBtn');
      const dopaThemeBtn = document.getElementById('dopaThemeBtn');
      const dopaMascotWrap = document.getElementById('dopaMascotWrap');
      const dopaHudRight = document.getElementById('dopaHudRight');

      body.className = 'h-screen w-screen overflow-hidden flex flex-col transition-colors duration-200 ' +
        (state.dopaMode
          ? 'dopa-mode text-[#1b1d4d]'
          : (dk ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-800'));
      syncBodyLevelClasses();

      header.className = 'shrink-0 border-b px-3 sm:px-4 py-1.5 flex flex-wrap items-center justify-between gap-2 shadow-sm z-10 transition-colors duration-200 ' +
        (dk ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200');

      title.className = 'text-sm sm:text-base font-extrabold tracking-tight ' +
        (dk ? 'text-white' : 'text-slate-900');

      poolBadge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full border ' +
        (dk ? 'bg-slate-800 text-slate-300 border-slate-700' : 'bg-slate-100 text-slate-600 border-slate-200');

      const groupCls = 'flex items-center p-0.5 rounded-lg border transition-colors ' +
        (dk ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200');
      modeGroup.className = groupCls;
      coefGroup.className = groupCls;
      if (targetGroup) targetGroup.className = groupCls;

      // Show/style sub-filter bar when 展開だけ or 因数分解だけ is selected
      const showSubBar = state.mode === 'expand' || state.mode === 'factor';
      if (typeFilterBar) {
        typeFilterBar.className = (showSubBar ? 'flex ' : 'hidden ') +
          'shrink-0 px-3 sm:px-4 py-1 border-b flex-wrap items-center justify-between gap-2 transition-colors duration-200 z-10 ' +
          (dk ? 'bg-slate-900/95 border-slate-800' : 'bg-white border-slate-200');
      }
      if (expandTypeWrap) {
        expandTypeWrap.className = 'flex items-center gap-1.5 flex-wrap transition-opacity duration-200 ' +
          (state.mode === 'expand' ? 'opacity-100' : 'opacity-45 hover:opacity-85');
      }
      if (factorTypeWrap) {
        factorTypeWrap.className = 'flex items-center gap-1.5 flex-wrap transition-opacity duration-200 ' +
          (state.mode === 'factor' ? 'opacity-100' : 'opacity-45 hover:opacity-85');
      }
      if (expandTypeGroup) {
        expandTypeGroup.className = 'flex items-center p-0.5 rounded-xl border transition-colors ' +
          (dk ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200');
      }
      if (factorTypeGroup) {
        factorTypeGroup.className = 'flex items-center p-0.5 rounded-xl border transition-colors ' +
          (dk ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200');
      }
      if (expandTypeLabel) {
        expandTypeLabel.className = 'px-2.5 py-0.5 rounded-lg text-[11px] font-extrabold border ' +
          (state.dopaMode
            ? 'bg-[#3b6bff] text-white border-2 border-[#1b1d4d]'
            : (dk ? 'bg-indigo-950 text-indigo-300 border-indigo-700' : 'bg-indigo-50 text-indigo-700 border-indigo-200'));
      }
      if (factorTypeLabel) {
        factorTypeLabel.className = 'px-2.5 py-0.5 rounded-lg text-[11px] font-extrabold border ' +
          (state.dopaMode
            ? 'bg-[#a77bff] text-white border-2 border-[#1b1d4d]'
            : (dk ? 'bg-purple-950 text-purple-300 border-purple-700' : 'bg-purple-50 text-purple-700 border-purple-200'));
      }

      document.querySelectorAll('.expand-type-btn').forEach(btn => {
        const active = btn.getAttribute('data-expand-type') === state.expandType;
        btn.className = 'expand-type-btn px-2.5 py-0.5 rounded-lg text-xs font-bold transition-all ' +
          (active
            ? 'active bg-indigo-600 text-white shadow-sm'
            : (dk ? 'text-slate-300 hover:text-white hover:bg-slate-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'));
      });
      document.querySelectorAll('.factor-type-btn').forEach(btn => {
        const active = btn.getAttribute('data-factor-type') === state.factorType;
        btn.className = 'factor-type-btn px-2.5 py-0.5 rounded-lg text-xs font-bold transition-all ' +
          (active
            ? 'active bg-purple-600 text-white shadow-sm'
            : (dk ? 'text-slate-300 hover:text-white hover:bg-slate-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'));
      });

      const secBtnCls = 'px-2.5 py-1 rounded-lg text-xs font-bold border transition-colors flex items-center gap-1 ' +
        (dk
          ? 'text-slate-200 bg-slate-800 hover:bg-slate-700 border-slate-700'
          : 'text-slate-700 bg-slate-100 hover:bg-slate-200 border-slate-200');
      const portalBtn = document.getElementById('portalBtn');
      if (portalBtn) portalBtn.className = secBtnCls;
      retryBtn.className = secBtnCls;
      soundBtn.className = secBtnCls;
      darkBtn.className = secBtnCls + (state.dopaMode ? ' hidden' : '');
      fullBtn.className = secBtnCls;

      if (dopaBtn) {
        dopaBtn.className = 'px-2.5 py-1 rounded-lg text-xs font-extrabold border-2 transition-all flex items-center gap-1 shadow-sm ' +
          (state.dopaMode
            ? 'bg-gradient-to-r from-[#ff7ab6] via-[#ffd23f] to-[#3fdcb0] text-[#1b1d4d] border-[#1b1d4d]'
            : (dk ? 'bg-slate-800 text-amber-300 border-amber-500/60 hover:bg-slate-700' : 'bg-amber-50 text-amber-900 border-amber-400 hover:bg-amber-100'));
        document.getElementById('dopaModeText').textContent = state.dopaMode ? 'ドパON' : 'ドパOFF';
      }

      if (dopaThemeBtn) {
        const curTh = bgEngine ? bgEngine.getCurrentTheme() : BACKDROP_THEMES[0];
        dopaThemeBtn.className = secBtnCls + (state.dopaMode ? '' : ' hidden');
        document.getElementById('dopaThemeIcon').textContent = curTh.icon;
        document.getElementById('dopaThemeText').textContent = curTh.name;
      }

      if (dopaMascotWrap) {
        dopaMascotWrap.classList.toggle('hidden', !state.dopaMode);
        dopaMascotWrap.classList.toggle('flex', state.dopaMode);
      }
      if (dopaHudRight) {
        dopaHudRight.classList.toggle('hidden', !state.dopaMode);
        dopaHudRight.classList.toggle('md:flex', state.dopaMode);
      }

      if (state.soundMode === 'all') {
        document.getElementById('soundToggleIcon').textContent = '🔊';
        document.getElementById('soundToggleText').textContent = state.dopaMode ? 'BGM+音' : '音ON';
      } else if (state.soundMode === 'sfx') {
        document.getElementById('soundToggleIcon').textContent = '🔔';
        document.getElementById('soundToggleText').textContent = '効果音のみ';
      } else {
        document.getElementById('soundToggleIcon').textContent = '🔇';
        document.getElementById('soundToggleText').textContent = '消音';
      }

      document.getElementById('darkModeIcon').textContent = dk ? '☀️' : '🌙';
      document.getElementById('darkModeText').textContent = dk ? 'ライト' : 'ダーク';

      document.querySelectorAll('.mode-btn').forEach(btn => {
        const active = btn.getAttribute('data-mode') === state.mode;
        btn.className = 'mode-btn px-2.5 py-1 rounded-md text-xs font-bold transition-all ' +
          (active
            ? 'active bg-indigo-600 text-white shadow-sm'
            : (dk ? 'text-slate-300 hover:text-white hover:bg-slate-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'));
      });
      document.querySelectorAll('.coef-btn').forEach(btn => {
        const active = btn.getAttribute('data-coef') === state.coef;
        btn.className = 'coef-btn px-2 py-1 rounded-md text-xs font-bold transition-all ' +
          (active
            ? 'active bg-indigo-600 text-white shadow-sm'
            : (dk ? 'text-slate-300 hover:text-white hover:bg-slate-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'));
      });
      document.querySelectorAll('.target-btn').forEach(btn => {
        const active = parseInt(btn.getAttribute('data-target'), 10) === state.targetStreak;
        btn.className = 'target-btn px-2 py-1 rounded-md text-xs font-bold transition-all ' +
          (active
            ? 'active bg-amber-500 text-white shadow-sm'
            : (dk ? 'text-slate-300 hover:text-white hover:bg-slate-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'));
      });
    }

    function renderStreakDots() {
      const container = document.getElementById('streakDots');
      const countText = document.getElementById('consecCountText');
      const consecBadge = document.getElementById('consecBadge');
      const dk = state.darkMode && !state.dopaMode;

      const displayStreak = state.perfectStreak;
      countText.textContent = `${displayStreak} / ${state.targetStreak}`;

      consecBadge.className = 'flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold border ' +
        (state.dopaMode
          ? 'bg-[#ffd23f] text-[#1b1d4d] border-2 border-[#1b1d4d] shadow-[0_2px_0_#1b1d4d]'
          : (dk
            ? 'bg-amber-950/60 text-amber-300 border-amber-700/80'
            : 'bg-amber-50 text-amber-800 border-amber-300'));

      const maxDots = Math.min(state.targetStreak, 10);
      const filledCount = Math.min(displayStreak, maxDots);
      let dotsHtml = '';
      for (let i = 0; i < maxDots; i++) {
        if (i < filledCount) {
          dotsHtml += `<span class="w-2.5 h-2.5 rounded-full ${state.dopaMode ? 'bg-[#ff4f6d] border border-[#1b1d4d]' : 'bg-amber-500'} shadow-sm"></span>`;
        } else {
          dotsHtml += `<span class="w-2 h-2 rounded-full ${state.dopaMode ? 'bg-white/80 border border-[#1b1d4d]/40' : (dk ? 'bg-slate-700' : 'bg-amber-200/80')}"></span>`;
        }
      }
      container.innerHTML = dotsHtml;
    }

    function renderStatusBanner() {
      const dk = state.darkMode && !state.dopaMode;
      const banner = document.getElementById('statusBanner');
      const badge = document.getElementById('statusBadge');
      const msg = document.getElementById('statusMessage');
      const streak = document.getElementById('streakBadge');
      const nextBtn = document.getElementById('bannerNextBtn');

      streak.textContent = `累計: ${state.totalCorrect} / ${state.totalAnswered}`;
      streak.className = 'hidden xl:inline-block text-[11px] font-bold px-2.5 py-0.5 rounded-full border ' +
        (dk ? 'text-indigo-300 bg-slate-800 border-slate-700' : 'text-indigo-700 bg-white border-indigo-200');

      renderStreakDots();
      updateDopaHud();

      const answeredCount = state.choices.filter(c => c !== null).length;

      if (!state.graded) {
        banner.className = 'relative shrink-0 h-11 px-3 sm:px-4 border-b flex items-center justify-between transition-colors duration-200 overflow-visible ' +
          (dk ? 'bg-slate-900/90 border-slate-800' : 'bg-indigo-50/90 border-indigo-100');
        badge.className = 'shrink-0 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold ' +
          (state.dopaMode ? 'bg-[#3b6bff] text-white border-2 border-[#1b1d4d] shadow-[0_2px_0_#1b1d4d]' : 'bg-indigo-600 text-white');
        badge.textContent = `選択中 ${answeredCount} / 6`;
        const rem = 6 - answeredCount;
        msg.className = 'text-xs font-bold truncate ' + (dk ? 'text-slate-300' : 'text-slate-700');
        msg.textContent = answeredCount === 0
          ? `6枚のカードすべてで「◯」か「☓」を選ぼう！（全問正解${state.targetStreak}回連続で合格！）`
          : `あと ${rem} 枚選ぶと、6枚すべての正解・不正解が一斉に判定されます！`;
        nextBtn.classList.add('hidden');
      } else {
        let correctCount = 0;
        state.cards.forEach((c, idx) => {
          const expected = c.isCorrect ? 'O' : 'X';
          if (state.choices[idx] === expected) correctCount++;
        });

        if (correctCount === 6) {
          banner.className = 'relative shrink-0 h-11 px-3 sm:px-4 border-b flex items-center justify-between transition-colors duration-200 overflow-visible ' +
            (dk ? 'bg-emerald-950/80 border-emerald-700' : 'bg-emerald-100 border-emerald-300');
          badge.className = 'shrink-0 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold ' +
            (state.dopaMode ? 'bg-[#3fdcb0] text-[#1b1d4d] border-2 border-[#1b1d4d] shadow-[0_2px_0_#1b1d4d]' : 'bg-emerald-600 text-white');
          badge.textContent = `🎉 6 / 6 全問正解！`;
          msg.className = 'text-xs font-extrabold truncate ' + (dk ? 'text-emerald-200' : 'text-emerald-900');
          if (state.perfectStreak >= state.targetStreak && state.perfectStreak % state.targetStreak === 0) {
            msg.textContent = `🏆 ${state.targetStreak}回連続全問正解達成！合格画面を表示します...`;
          } else {
            msg.textContent = `パーフェクト！（連続 ${state.perfectStreak} / ${state.targetStreak} 回目）自動的に次の6問へ進みます...`;
          }
          nextBtn.classList.remove('hidden');
        } else {
          banner.className = 'relative shrink-0 h-11 px-3 sm:px-4 border-b flex items-center justify-between transition-colors duration-200 overflow-visible ' +
            (dk ? 'bg-amber-950/70 border-amber-700' : 'bg-amber-100/90 border-amber-300');
          badge.className = 'shrink-0 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold ' +
            (state.dopaMode ? 'bg-[#ff4f6d] text-white border-2 border-[#1b1d4d] shadow-[0_2px_0_#1b1d4d]' : 'bg-amber-600 text-white');
          badge.textContent = `採点結果: ${correctCount} / 6 正解`;
          msg.className = 'text-xs font-extrabold truncate ' + (dk ? 'text-amber-200' : 'text-amber-950');
          msg.textContent = `6枚中 ${correctCount}枚 正解！（間違いを確認して「次の6問へ」進もう）`;
          nextBtn.classList.remove('hidden');
        }
      }
    }

    function renderCards() {
      const dk = state.darkMode && !state.dopaMode;

      state.cards.forEach((card, idx) => {
        const el = document.getElementById(`card-${idx}`);
        const userChoice = state.choices[idx];
        const expectedChoice = card.isCorrect ? 'O' : 'X';
        const isUserRight = state.graded && (userChoice === expectedChoice);

        let cardBorderClass = dk
          ? 'border-slate-800 bg-slate-900 hover:border-slate-700 text-slate-100'
          : 'border-slate-200 bg-white hover:border-slate-300 text-slate-900';

        let dopaStateClass = '';

        if (!state.graded && userChoice !== null) {
          if (userChoice === 'O') {
            dopaStateClass = 'dopa-card-o';
            cardBorderClass = dk
              ? 'border-sky-500 bg-sky-950/35 ring-2 ring-sky-500/40 text-slate-100'
              : 'border-sky-500 bg-sky-50/20 ring-2 ring-sky-200 text-slate-900';
          } else {
            dopaStateClass = 'dopa-card-x';
            cardBorderClass = dk
              ? 'border-rose-500 bg-rose-950/35 ring-2 ring-rose-500/40 text-slate-100'
              : 'border-rose-500 bg-rose-50/20 ring-2 ring-rose-200 text-slate-900';
          }
        } else if (state.graded) {
          if (isUserRight) {
            dopaStateClass = 'dopa-card-right';
            cardBorderClass = dk
              ? 'border-emerald-500 bg-emerald-950/35 ring-2 ring-emerald-500/40 text-slate-100 animate-pop'
              : 'border-emerald-500 bg-emerald-50/25 ring-2 ring-emerald-200 text-slate-900 animate-pop';
          } else {
            dopaStateClass = 'dopa-card-wrong';
            cardBorderClass = dk
              ? 'border-rose-500 bg-rose-950/45 ring-2 ring-rose-500/50 text-slate-100 animate-pop'
              : 'border-rose-500 bg-rose-50/40 ring-2 ring-rose-300 text-slate-900 animate-pop';
          }
        }

        let statusPillHtml = '';
        if (!state.graded) {
          if (userChoice === 'O') {
            statusPillHtml = `<span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold ${dk ? 'bg-sky-900/80 text-sky-200 border-sky-600' : 'bg-sky-100 text-sky-700 border-sky-300'} border">◯ 選択中</span>`;
          } else if (userChoice === 'X') {
            statusPillHtml = `<span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold ${dk ? 'bg-rose-900/80 text-rose-200 border-rose-600' : 'bg-rose-100 text-rose-700 border-rose-300'} border">☓ 選択中</span>`;
          } else {
            statusPillHtml = `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${dk ? 'bg-slate-800 text-slate-500' : 'bg-slate-100 text-slate-400'}">未選択</span>`;
          }
        } else {
          const actualLabel = card.isCorrect ? '式は ◯' : '式は ☓';
          const actualPillClass = card.isCorrect
            ? (dk ? 'bg-sky-900/80 text-sky-200 border-sky-600' : 'bg-sky-100 text-sky-800 border-sky-300')
            : (dk ? 'bg-amber-900/80 text-amber-200 border-amber-600' : 'bg-amber-100 text-amber-900 border-amber-300');
          const judgeBadge = isUserRight
            ? `<span class="px-2 py-0.5 rounded-md text-xs font-extrabold bg-emerald-600 text-white shadow-sm">✓ 正解</span>`
            : `<span class="px-2 py-0.5 rounded-md text-xs font-extrabold bg-rose-600 text-white shadow-sm">✕ 不正解</span>`;
          statusPillHtml = `
            <div class="flex items-center gap-1">
              <span class="px-1.5 py-0.5 rounded text-[10px] font-bold border ${actualPillClass}">${actualLabel}</span>
              ${judgeBadge}
            </div>
          `;
        }

        const stampHtml = (state.dopaMode && state.graded)
          ? `<div class="dopa-stamp ${isUserRight ? 'ok' : 'ng'}">${isUserRight ? '★正解!' : 'おしい!'}</div>`
          : '';

        const catColor = card.prob.cat === 'expand'
          ? (dk ? 'bg-indigo-950/80 text-indigo-300 border-indigo-700' : 'bg-indigo-50 text-indigo-700 border-indigo-200')
          : card.prob.cat === 'factor'
          ? (dk ? 'bg-purple-950/80 text-purple-300 border-purple-700' : 'bg-purple-50 text-purple-700 border-purple-200')
          : (dk ? 'bg-teal-950/80 text-teal-300 border-teal-700' : 'bg-teal-50 text-teal-700 border-teal-200');
        const dfTag = card.prob.isDecFrac
          ? `<span class="px-1.5 py-0.2 rounded text-[10px] font-bold border ${dk ? 'bg-amber-950/80 text-amber-300 border-amber-700' : 'bg-amber-50 text-amber-700 border-amber-200'}">小数/分数</span>`
          : '';

        const qHtml = renderMathExpr(card.prob.q);
        const eqHtml = renderMathExpr('=');
        const ansHtml = renderMathExpr(card.shownAns);

        let feedbackHtml = '';
        if (state.graded) {
          if (card.isCorrect) {
            feedbackHtml = `
              <div class="mt-1.5 px-2.5 py-1 rounded-lg border text-[11px] leading-snug flex items-center justify-center gap-1.5 w-full ${dk ? 'bg-emerald-950/70 border-emerald-700 text-emerald-200' : 'bg-emerald-50 border-emerald-200 text-emerald-900'}">
                <span class="font-bold">【◯ 正しい式】 ${card.reason}</span>
              </div>
            `;
          } else {
            const trueAnsHtml = renderMathExpr(`= ${card.prob.a}`);
            feedbackHtml = `
              <div class="mt-1 px-2.5 py-1 rounded-lg border text-[11px] leading-tight flex flex-col items-center gap-0.5 w-full ${dk ? 'bg-amber-950/75 border-amber-700 text-slate-100' : 'bg-amber-50/95 border-amber-300 text-slate-900'}">
                <div class="flex items-center gap-1.5 flex-wrap justify-center">
                  <span class="px-1.5 py-0.2 rounded bg-emerald-600 text-white font-extrabold text-[10px]">正しい答</span>
                  <span class="font-bold text-xs ${dk ? 'text-emerald-300' : 'text-emerald-900'}">${trueAnsHtml}</span>
                </div>
                <div class="text-[10px] font-bold text-center truncate w-full ${dk ? 'text-rose-300' : 'text-rose-800'}" title="${card.reason}">
                  💡 ${card.reason}
                </div>
              </div>
            `;
          }
        }

        const oSelected = userChoice === 'O';
        const xSelected = userChoice === 'X';

        let oBtnClass = dk
          ? 'border-slate-700 bg-slate-800 text-slate-200 hover:bg-sky-950 hover:border-sky-500 hover:text-sky-300'
          : 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-sky-50 hover:border-sky-300 hover:text-sky-700';
        let xBtnClass = dk
          ? 'border-slate-700 bg-slate-800 text-slate-200 hover:bg-rose-950 hover:border-rose-500 hover:text-rose-300'
          : 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-rose-50 hover:border-rose-300 hover:text-rose-700';

        if (oSelected) {
          oBtnClass = 'selected-o dopa-btn-o-sel border-sky-600 bg-sky-600 text-white shadow-sm';
        } else {
          oBtnClass += ' dopa-btn-o-idle';
        }
        if (xSelected) {
          xBtnClass = 'selected-x dopa-btn-x-sel border-rose-600 bg-rose-600 text-white shadow-sm';
        } else {
          xBtnClass += ' dopa-btn-x-idle';
        }
        if (state.graded) {
          oBtnClass += ' cursor-default';
          xBtnClass += ' cursor-default';
        }

        const numCircleCls = state.dopaMode
          ? 'bg-[#ffd23f] text-[#1b1d4d] border-2 border-[#1b1d4d]'
          : (dk ? 'bg-slate-700 text-slate-100' : 'bg-slate-800 text-white');

        el.className = `quiz-card rounded-xl border-2 p-2.5 flex flex-col justify-between min-h-0 overflow-hidden shadow-sm transition-all duration-150 ${cardBorderClass} ${dopaStateClass}`;
        el.innerHTML = `
          <div class="card-marquee"></div>
          ${stampHtml}
          <!-- Card Header -->
          <div class="shrink-0 flex items-center justify-between gap-1 relative z-10">
            <div class="flex items-center gap-1.5">
              <span class="w-5 h-5 rounded-full ${numCircleCls} text-[11px] font-extrabold flex items-center justify-center">
                ${idx + 1}
              </span>
              <span class="px-1.5 py-0.2 rounded text-[11px] font-bold border ${catColor}">
                ${card.prob.label}
              </span>
              ${dfTag}
            </div>
            ${statusPillHtml}
          </div>

          <!-- Center Formula Area -->
          <div class="flex-1 min-h-0 flex flex-col items-center justify-center py-0.5 overflow-x-auto overflow-y-hidden relative z-10">
            <div class="math-card-align">
              <div class="math-eq-cell" aria-hidden="true"></div>
              <div class="math-expr-cell">${qHtml}</div>
              <div class="math-eq-cell">${eqHtml}</div>
              <div class="math-expr-cell">${ansHtml}</div>
            </div>
            ${feedbackHtml}
          </div>

          <!-- Card Footer: ◯ / ☓ Buttons -->
          <div class="shrink-0 grid grid-cols-2 gap-2 pt-1 relative z-10">
            <button
              type="button"
              data-card="${idx}"
              data-choice="O"
              class="choice-btn py-1.5 px-3 rounded-lg border-2 font-extrabold text-sm sm:text-base flex items-center justify-center gap-1.5 transition-all ${oBtnClass}"
              ${state.graded ? 'disabled' : ''}
            >
              <span class="text-base sm:text-lg leading-none">◯</span>
              <span class="text-xs font-bold">正しい</span>
            </button>
            <button
              type="button"
              data-card="${idx}"
              data-choice="X"
              class="choice-btn py-1.5 px-3 rounded-lg border-2 font-extrabold text-sm sm:text-base flex items-center justify-center gap-1.5 transition-all ${xBtnClass}"
              ${state.graded ? 'disabled' : ''}
            >
              <span class="text-base sm:text-lg leading-none">☓</span>
              <span class="text-xs font-bold">間違い</span>
            </button>
          </div>
        `;
      });

      document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cIdx = parseInt(btn.getAttribute('data-card'), 10);
          const ch = btn.getAttribute('data-choice');
          selectCardChoice(cIdx, ch, btn);
        });
      });
    }

    function renderAll() {
      applyThemeClasses();
      renderStatusBanner();
      renderCards();
    }

    // =========================================================================
    // FULLSCREEN & EVENT LISTENERS
    // =========================================================================
    function toggleFullscreen() {
      try {
        const doc = window.document;
        const docEl = doc.documentElement;
        const isFull = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;
        if (!isFull) {
          const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
          if (req) Promise.resolve(req.call(docEl)).catch(() => {});
        } else {
          const exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
          if (exit) Promise.resolve(exit.call(doc)).catch(() => {});
        }
      } catch (e) {}
    }

    function updateFullscreenButtonLabel() {
      const doc = window.document;
      const isFull = Boolean(doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement);
      const textEl = document.getElementById('fullscreenText');
      if (textEl) textEl.textContent = isFull ? '全画面解除' : '全画面';
    }

    document.addEventListener('fullscreenchange', updateFullscreenButtonLabel);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButtonLabel);

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        DopaAudio.init();
        const newMode = btn.getAttribute('data-mode');
        if (state.mode !== newMode) {
          state.mode = newMode;
          state.perfectStreak = 0;
          if (state.dopaMode) DopaAudio.tap(2);
          sampleProblemsForHand();
        }
      });
    });

    document.querySelectorAll('.coef-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        DopaAudio.init();
        const newCoef = btn.getAttribute('data-coef');
        if (state.coef !== newCoef) {
          state.coef = newCoef;
          state.perfectStreak = 0;
          if (state.dopaMode) DopaAudio.tap(3);
          sampleProblemsForHand();
        }
      });
    });

    document.querySelectorAll('.expand-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        DopaAudio.init();
        const newType = btn.getAttribute('data-expand-type');
        if (state.mode !== 'expand' || state.expandType !== newType) {
          state.mode = 'expand';
          state.expandType = newType;
          state.perfectStreak = 0;
          if (state.dopaMode) DopaAudio.tap(3);
          sampleProblemsForHand();
        }
      });
    });

    document.querySelectorAll('.factor-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        DopaAudio.init();
        const newType = btn.getAttribute('data-factor-type');
        if (state.mode !== 'factor' || state.factorType !== newType) {
          state.mode = 'factor';
          state.factorType = newType;
          state.perfectStreak = 0;
          if (state.dopaMode) DopaAudio.tap(3);
          sampleProblemsForHand();
        }
      });
    });

    document.querySelectorAll('.target-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        DopaAudio.init();
        const newTarget = parseInt(btn.getAttribute('data-target'), 10);
        if (!isNaN(newTarget) && state.targetStreak !== newTarget) {
          state.targetStreak = newTarget;
          if (state.perfectStreak >= state.targetStreak) {
            state.perfectStreak = 0;
          }
          if (bgEngine) bgEngine.setReach(state.perfectStreak === state.targetStreak - 1);
          if (state.dopaMode) DopaAudio.tap(4);
          renderAll();
        }
      });
    });

    document.getElementById('newSetBtn').addEventListener('click', () => {
      DopaAudio.init();
      if (state.dopaMode) DopaAudio.tap(4);
      sampleProblemsForHand();
    });

    document.getElementById('bannerNextBtn').addEventListener('click', () => {
      DopaAudio.init();
      if (state.dopaMode) DopaAudio.tap(4);
      sampleProblemsForHand();
    });

    document.getElementById('retrySameBtn').addEventListener('click', () => {
      DopaAudio.init();
      if (state.dopaMode) DopaAudio.tap(1);
      resetCurrentChoices();
    });

    document.getElementById('dopaModeBtn').addEventListener('click', () => {
      DopaAudio.init();
      state.dopaMode = !state.dopaMode;
      DopaAudio.syncVolumes();
      renderAll();
      if (state.dopaMode) {
        DopaAudio.levelUp(Math.max(1, state.level));
        cutin('ドパモード ON!!', '超ド派手フィーバー演出⚡');
        mascot.react('super');
        mascot.say('ドパきち参上！！全問正解を目指そう⚡', 1800);
        if (fxEngine) {
          fxEngine.launchStreamers('both', 16);
          fxEngine.burst(window.innerWidth / 2, window.innerHeight / 2, {
            count: 45, power: 11, shapes: ['confetti', 'star', 'spark']
          });
        }
      }
    });

    document.getElementById('dopaThemeBtn').addEventListener('click', () => {
      DopaAudio.init();
      if (!bgEngine) return;
      const th = bgEngine.cycleTheme();
      DopaAudio.tap(5);
      renderAll();
      cutin(`${th.icon} ${th.name}`, '背景テーマチェンジ！');
      mascot.react('happy');
      mascot.say(`背景が「${th.name}」になったよ✨`, 1400);
    });

    document.getElementById('dopaMascot').addEventListener('click', () => {
      DopaAudio.init();
      DopaAudio.tap(6);
      mascot.react('super');
      const lines = [
        '6枚ぜんぶ当ててコンボをつなごう！🔥',
        '対称式は (x+y)² − 2xy がキホン！✨',
        `${state.targetStreak}回連続パーフェクトで合格だよ🏆`,
        'ノリノリでいこう〜！！🎵'
      ];
      mascot.say(lines[Math.floor(Math.random() * lines.length)], 1600);
      const r = document.getElementById('dopaMascot').getBoundingClientRect();
      if (fxEngine) {
        fxEngine.burst(r.left + r.width / 2, r.top + r.height / 2, {
          count: 20, power: 8, shapes: ['heart', 'star', 'mini']
        });
      }
    });

    document.getElementById('soundToggleBtn').addEventListener('click', () => {
      DopaAudio.init();
      if (state.dopaMode) {
        state.soundMode = state.soundMode === 'all' ? 'sfx' : (state.soundMode === 'sfx' ? 'mute' : 'all');
      } else {
        state.soundMode = state.soundMode === 'mute' ? 'all' : 'mute';
      }
      DopaAudio.syncVolumes();
      renderAll();
    });

    document.getElementById('darkModeBtn').addEventListener('click', () => {
      state.darkMode = !state.darkMode;
      renderAll();
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      toggleFullscreen();
    });

    document.getElementById('passRestartBtn').addEventListener('click', () => {
      hidePassModal();
      state.perfectStreak = 0;
      sampleProblemsForHand();
    });

    document.getElementById('passContinueBtn').addEventListener('click', () => {
      hidePassModal();
      sampleProblemsForHand();
    });

    const lvBadgeEl = document.querySelector('.dopa-lv');
    if (lvBadgeEl) {
      lvBadgeEl.addEventListener('click', () => {
        if (!state.dopaMode) return;
        DopaAudio.init();
        if (state.level >= 9) {
          state.hype = 0;
          state.level = 0;
          applyLevelVisuals();
          mascot.say('LV.0 にリセットしたよ！また盛り上げよう⚡', 1400);
        } else {
          const nextTarget = LEVEL_THRESHOLDS[state.level + 1] || 100;
          addHype((nextTarget - state.hype) + 1);
        }
      });
    }

    // =========================================================================
    // MAIN ANIMATION LOOP (Beat Kick + WebGL Shader + FX Particles + Score Roll)
    // =========================================================================
    function startDopaLoop() {
      const ptEl = document.getElementById('dopaPtText');
      function frame(now) {
        requestAnimationFrame(frame);
        try {
          if (state.dopaMode) {
            // Gentle hype decay when idle, keeping current floor
            const floor = LEVEL_THRESHOLDS[state.level] || 0;
            if (state.hype > floor + 1) {
              state.hype = Math.max(floor, state.hype - 0.012);
            }
            const kick = DopaAudio.getKick(now);
            document.documentElement.style.setProperty('--kick', kick.toFixed(3));
            if (bgEngine) bgEngine.step(now, kick);
            if (fxEngine) fxEngine.step(state.level, kick);

            if (state.displayPts !== state.dopaPts) {
              const diff = state.dopaPts - state.displayPts;
              state.displayPts += Math.ceil(diff * 0.18);
              if (ptEl) ptEl.textContent = state.displayPts.toLocaleString();
            }
          } else {
            document.documentElement.style.setProperty('--kick', '0');
            if (fxEngine) fxEngine.step(0, 0);
          }
        } catch (err) {
          console.warn('Animation frame error:', err);
        }
      }
      requestAnimationFrame(frame);
    }

    window.addEventListener('DOMContentLoaded', () => {
      buildBunting();
      buildLevelPips();
      mascot.init();
      fxEngine = new FXEngine(document.getElementById('fx'));
      bgEngine = new Backdrop(document.getElementById('bg'));
      applyLevelVisuals();
      sampleProblemsForHand();
      startDopaLoop();
      setTimeout(() => {
        if (state.dopaMode) {
          mascot.say('6枚の◯☓をぜんぶ選んでね！⚡', 2000);
        }
      }, 400);
    });
    window.addEventListener('load', () => {
      renderAll();
    });
  </script>
</body>
</html>
