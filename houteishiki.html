  <script>
    // ----------------------------------------------------
    // Sound Effects Engine using Tone.js Synth
    // ----------------------------------------------------
    let soundEnabled = true;
    let correctSynth = null;
    let wrongSynth = null;

    function initAudio() {
      if (correctSynth) return;
      try {
        correctSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'sine' },
          envelope: { attack: 0.005, decay: 0.1, sustain: 0.05, release: 0.2 }
        }).toDestination();
        correctSynth.volume.value = -8;

        wrongSynth = new Tone.MembraneSynth({
          pitchDecay: 0.05,
          octaves: 2,
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
        }).toDestination();
        wrongSynth.volume.value = -6;
      } catch (e) {
        console.warn("Audio init failed", e);
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      try {
        if (Tone.context.state !== 'running') {
          Tone.context.resume();
        }
        if (type === 'correct' && correctSynth) {
          const now = Tone.now();
          correctSynth.triggerAttackRelease(['E5', 'B5'], '16n', now);
        } else if (type === 'wrong' && wrongSynth) {
          wrongSynth.triggerAttackRelease('G2', '8n');
        }
      } catch (e) {
        // Fallback or ignore
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-icon-on').classList.toggle('hidden', !soundEnabled);
      document.getElementById('sound-icon-off').classList.toggle('hidden', soundEnabled);
    }

    // ----------------------------------------------------
    // Dark Mode and Fullscreen Controls
    // ----------------------------------------------------
    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      try {
        localStorage.setItem('eq_trainer_dark', isDark ? 'true' : 'false');
      } catch (e) {}
    }

    // Initialize dark theme preference
    if (localStorage.getItem('eq_trainer_dark') === 'true' || 
        (!('eq_trainer_dark' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn("Fullscreen request failed", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // ----------------------------------------------------
    // Fraction Class (Irreducible, signed, LaTeX export)
    // ----------------------------------------------------
    class Fraction {
      constructor(n, d = 1) {
        if (d === 0) throw new Error("Denominator cannot be 0");
        let num = Math.round(n);
        let den = Math.round(d);
        if (den < 0) {
          num = -num;
          den = -den;
        }
        const g = Fraction.gcd(Math.abs(num), den);
        this.n = num / g;
        this.d = den / g;
      }

      static gcd(a, b) {
        return b === 0 ? a : Fraction.gcd(b, a % b);
      }

      equals(other) {
        return this.n === other.n && this.d === other.d;
      }

      reciprocal() {
        return new Fraction(this.d, this.n);
      }

      negate() {
        return new Fraction(-this.n, this.d);
      }

      multiply(other) {
        return new Fraction(this.n * other.n, this.d * other.d);
      }

      divide(other) {
        return new Fraction(this.n * other.d, this.d * other.n);
      }

      // Convert to LaTeX representation for coefficient of x
      toCoeffLatex() {
        if (this.n === 1 && this.d === 1) return "";
        if (this.n === -1 && this.d === 1) return "-";
        return this.toLatex();
      }

      toLatex() {
        if (this.d === 1) return `${this.n}`;
        if (this.n < 0) {
          return `-\\frac{${Math.abs(this.n)}}{${this.d}}`;
        }
        return `\\frac{${this.n}}{${this.d}}`;
      }
    }

    // ----------------------------------------------------
    // Problem Generator Engine
    // ----------------------------------------------------
    // Base triads (a * b = c)
    const TRIADS = [
      { a: 2, b: 3, c: 6 },
      { a: 2, b: 5, c: 10 },
      { a: 3, b: 4, c: 12 },
      { a: 2, b: 4, c: 8 },
      { a: 3, b: 5, c: 15 }
    ];

    let currentMode = 'random'; // 'pos-pos', 'neg-neg', 'pos-neg', 'random'
    let currentProblem = null;
    let answered = false;
    let autoAdvanceOnCorrect = true; // 正解時自動で次の問題へ
    let autoNextTimer = null;

    // Stats state
    let stats = {
      correct: 0,
      total: 0,
      streak: 0
    };

    // Helper: Convert LaTeX text containing $...$ or raw \frac to KaTeX HTML
    function renderMathInText(text) {
      if (!text) return '';
      // 1. Render explicit $...$ LaTeX blocks
      let result = text.replace(/\$([^\$]+)\$/g, (match, expr) => {
        try {
          return katex.renderToString(expr.trim(), { throwOnError: false, displayMode: false });
        } catch (e) {
          return match;
        }
      });
      // 2. Render remaining standalone LaTeX \frac expressions if any
      result = result.replace(/\\frac\{[^{}]+\}\{[^{}]+\}/g, (match) => {
        try {
          return katex.renderToString(match.trim(), { throwOnError: false, displayMode: false });
        } catch (e) {
          return match;
        }
      });
      return result;
    }

    function setSignMode(mode) {
      clearTimeout(autoNextTimer);
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'dark:bg-indigo-600', 'shadow-sm', 'text-indigo-600', 'dark:text-white', 'font-bold');
      });
      const activeBtn = document.getElementById(`mode-${mode}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'dark:bg-indigo-600', 'shadow-sm', 'text-indigo-600', 'dark:text-white', 'font-bold');
      }
      nextQuestion();
    }

    function generateProblem() {
      // Pick random triad
      const triad = TRIADS[Math.floor(Math.random() * TRIADS.length)];
      const { a, b, c } = triad;

      // 10 tricky patterns based on a * b = c
      const patternTemplates = [
        {
          name: "基本除算 (係数が大)",
          getCoeff: () => new Fraction(c),
          getRight: () => new Fraction(a),
          getDesc: (coeff, right, solution) => `両辺を係数 $${coeff.toLatex()}$ で割る（$\\times ${coeff.reciprocal().toLatex()}$）$\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "基本除算 (係数が小)",
          getCoeff: () => new Fraction(a),
          getRight: () => new Fraction(c),
          getDesc: (coeff, right, solution) => `両辺を係数 $${coeff.toLatex()}$ で割る $\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "仮分数係数 × 整数",
          getCoeff: () => new Fraction(c, a), // b
          getRight: () => new Fraction(c),
          getDesc: (coeff, right, solution) => `両辺に逆数 $${coeff.reciprocal().toLatex()}$ を掛ける $\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "真分数係数 × 整数",
          getCoeff: () => new Fraction(a, b),
          getRight: () => new Fraction(c),
          getDesc: (coeff, right, solution) => `両辺に逆数 $${coeff.reciprocal().toLatex()}$ を掛ける $\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "真分数係数(逆) × 整数",
          getCoeff: () => new Fraction(b, a),
          getRight: () => new Fraction(c),
          getDesc: (coeff, right, solution) => `両辺に逆数 $${coeff.reciprocal().toLatex()}$ を掛ける $\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "整数係数 × 真分数",
          getCoeff: () => new Fraction(c),
          getRight: () => new Fraction(a, b),
          getDesc: (coeff, right, solution) => `右辺に逆数 $\\times ${coeff.reciprocal().toLatex()}$ を掛ける（係数 $${coeff.toLatex()}$ で割る）$\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "整数係数 × 仮分数",
          getCoeff: () => new Fraction(c),
          getRight: () => new Fraction(b, a),
          getDesc: (coeff, right, solution) => `右辺に逆数 $\\times ${coeff.reciprocal().toLatex()}$ を掛ける（係数 $${coeff.toLatex()}$ で割る）$\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "単位分数係数 × 分数",
          getCoeff: () => new Fraction(1, c),
          getRight: () => new Fraction(a, b),
          getDesc: (coeff, right, solution) => `両辺に逆数 $${coeff.reciprocal().toLatex()}$ を掛ける $\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "単位分数係数 × 分数(逆)",
          getCoeff: () => new Fraction(1, c),
          getRight: () => new Fraction(b, a),
          getDesc: (coeff, right, solution) => `両辺に逆数 $${coeff.reciprocal().toLatex()}$ を掛ける $\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "分数係数 × 単位分数",
          getCoeff: () => new Fraction(a, b),
          getRight: () => new Fraction(1, c),
          getDesc: (coeff, right, solution) => `右辺に逆数 $${coeff.reciprocal().toLatex()}$ を掛ける $\\rightarrow x = ${solution.toLatex()}$`
        },
        {
          name: "分数係数(逆) × 単位分数",
          getCoeff: () => new Fraction(b, a),
          getRight: () => new Fraction(1, c),
          getDesc: (coeff, right, solution) => `右辺に逆数 $${coeff.reciprocal().toLatex()}$ を掛ける $\\rightarrow x = ${solution.toLatex()}$`
        }
      ];

      const template = patternTemplates[Math.floor(Math.random() * patternTemplates.length)];
      let coeff = template.getCoeff();
      let right = template.getRight();

      // Apply sign according to currentMode
      let signConfig = currentMode;
      if (signConfig === 'random') {
        const modes = ['pos-pos', 'neg-neg', 'pos-neg'];
        signConfig = modes[Math.floor(Math.random() * modes.length)];
      }

      if (signConfig === 'neg-neg') {
        coeff = coeff.negate();
        right = right.negate();
      } else if (signConfig === 'pos-neg') {
        // Randomly pick whether left is neg or right is neg
        if (Math.random() < 0.5) {
          coeff = coeff.negate();
        } else {
          right = right.negate();
        }
      }

      // Exact solution: x = right / coeff
      const solution = right.divide(coeff);

      // Generate systematic distractors (common student traps)
      const distractors = [];

      function addDistractor(frac) {
        if (!frac || frac.d === 0) return;
        // Don't add if already equals solution or existing distractors
        if (frac.equals(solution)) return;
        if (distractors.some(d => d.equals(frac))) return;
        distractors.push(frac);
      }

      // Trap 1: Inverted answer (divided upside-down)
      addDistractor(solution.reciprocal());

      // Trap 2: Sign error (forgot negative)
      addDistractor(solution.negate());

      // Trap 3: Inverted answer with sign error
      addDistractor(solution.reciprocal().negate());

      // Trap 4: Multiplied instead of dividing (or inverted the wrong side)
      addDistractor(right.multiply(coeff));
      addDistractor(right.multiply(coeff).negate());

      // Trap 5: Misapplied reciprocal (multiplied by coeff directly)
      addDistractor(right.multiply(new Fraction(coeff.n, coeff.d)));

      // Trap 6: Swapping base values (a <-> b or a^2 <-> b^2)
      addDistractor(new Fraction(a));
      addDistractor(new Fraction(1, a));
      addDistractor(new Fraction(b));
      addDistractor(new Fraction(1, b));
      addDistractor(new Fraction(a * a));
      addDistractor(new Fraction(1, a * a));
      addDistractor(new Fraction(b * b));
      addDistractor(new Fraction(1, b * b));
      addDistractor(new Fraction(-a));
      addDistractor(new Fraction(-1, a));
      addDistractor(new Fraction(-b));
      addDistractor(new Fraction(-1, b));
      addDistractor(new Fraction(-a * a));
      addDistractor(new Fraction(-1, a * a));
      addDistractor(new Fraction(-b * b));
      addDistractor(new Fraction(-1, b * b));

      // Pick 5 distinct distractors
      const selectedDistractors = distractors.slice(0, 5);

      // If somehow fewer than 5, supplement
      let offset = 2;
      while (selectedDistractors.length < 5) {
        addDistractor(new Fraction(solution.n + offset, solution.d));
        offset++;
      }

      // Pool of 6 choices (1 correct + 5 distractors)
      const options = [solution, ...selectedDistractors.slice(0, 5)];

      // Fisher-Yates shuffle
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }

      const correctIndex = options.findIndex(opt => opt.equals(solution));
      const explanation = template.getDesc ? template.getDesc(coeff, right, solution) : template.desc;

      return {
        coeff,
        right,
        solution,
        options,
        correctIndex,
        templateName: template.name,
        explanation
      };
    }

    // ----------------------------------------------------
    // Render and Game Lifecycle
    // ----------------------------------------------------
    function renderQuestion() {
      clearTimeout(autoNextTimer);
      answered = false;
      currentProblem = generateProblem();

      // Reset & hide feedback banner completely on new question
      const banner = document.getElementById('feedback-banner');
      banner.className = "w-full mt-3 p-3 rounded-2xl hidden items-center justify-between text-sm opacity-0 pointer-events-none transition-all";
      document.getElementById('feedback-title').innerHTML = '';
      document.getElementById('feedback-desc').innerHTML = '';

      // Update Tag
      document.getElementById('pattern-tag').textContent = currentProblem.templateName;

      // Render equation in KaTeX
      const coeffTex = currentProblem.coeff.toCoeffLatex();
      const rightTex = currentProblem.right.toLatex();
      const eqTex = `${coeffTex}x = ${rightTex}`;
      
      katex.render(eqTex, document.getElementById('equation-display'), {
        throwOnError: false,
        displayMode: true
      });

      // Render 6 options
      currentProblem.options.forEach((opt, idx) => {
        const btn = document.getElementById(`opt-${idx}`);
        // Reset classes
        btn.className = "option-btn group relative flex items-center justify-center p-3 md:p-4 rounded-2xl bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 hover:border-indigo-400 dark:hover:border-indigo-500 hover:shadow-md transition-all active:scale-[0.98] h-20 md:h-24 cursor-pointer";
        btn.disabled = false;

        const mathElem = btn.querySelector('.opt-math');
        katex.render(`x = ${opt.toLatex()}`, mathElem, {
          throwOnError: false,
          displayMode: false
        });
      });
    }

    function handleChoice(chosenIndex) {
      if (answered) return;
      answered = true;

      stats.total++;
      const isCorrect = chosenIndex === currentProblem.correctIndex;

      // Highlight buttons
      currentProblem.options.forEach((_, idx) => {
        const btn = document.getElementById(`opt-${idx}`);
        btn.disabled = true;
        btn.classList.remove('hover:border-indigo-400', 'dark:hover:border-indigo-500', 'cursor-pointer');

        if (idx === currentProblem.correctIndex) {
          // Highlight correct answer in green
          btn.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950/40', 'dark:border-emerald-500', 'text-emerald-700', 'dark:text-emerald-300');
        } else if (idx === chosenIndex) {
          // Highlight selected wrong answer in red
          btn.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/40', 'dark:border-rose-500', 'text-rose-700', 'dark:text-rose-300');
        } else {
          btn.classList.add('opacity-40');
        }
      });

      // Update statistics
      if (isCorrect) {
        stats.correct++;
        stats.streak++;
        playSound('correct');
      } else {
        stats.streak = 0;
        playSound('wrong');
      }
      updateStatsUI();

      // Show Feedback Banner with concise pedagogical explanation
      const banner = document.getElementById('feedback-banner');
      const icon = document.getElementById('feedback-icon');
      const title = document.getElementById('feedback-title');
      const desc = document.getElementById('feedback-desc');

      const solLatex = `x = ${currentProblem.solution.toLatex()}`;
      let solHtml = '';
      try {
        solHtml = katex.renderToString(solLatex, { throwOnError: false, displayMode: false });
      } catch (e) {
        solHtml = solLatex;
      }

      const nextBtn = document.getElementById('next-btn');

      if (isCorrect) {
        banner.className = "w-full mt-3 p-3 rounded-2xl flex items-center justify-between text-sm transition-all opacity-100 bg-emerald-100 text-emerald-900 dark:bg-emerald-950/80 dark:text-emerald-100 border border-emerald-300 dark:border-emerald-800";
        icon.className = "w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold shrink-0";
        icon.innerHTML = "✓";
        title.innerHTML = `<span>正解！</span> <span class="ml-1.5 inline-block font-semibold">${solHtml}</span>`;
        desc.innerHTML = `<span class="opacity-90 font-medium">正解です！ 次の問題へ…</span>`;
        if (nextBtn) nextBtn.classList.add('hidden');
        banner.classList.remove('pointer-events-none', 'translate-y-1');

        // 正解のときは400msで自動的に次の問題へ進む
        clearTimeout(autoNextTimer);
        autoNextTimer = setTimeout(() => {
          nextQuestion();
        }, 400);
      } else {
        banner.className = "w-full mt-3 p-3 rounded-2xl flex items-center justify-between text-sm transition-all opacity-100 bg-rose-100 text-rose-900 dark:bg-rose-950/80 dark:text-rose-100 border border-rose-300 dark:border-rose-800";
        icon.className = "w-8 h-8 rounded-full bg-rose-500 flex items-center justify-center text-white font-bold shrink-0";
        icon.innerHTML = "✕";
        title.innerHTML = `<span>不正解！ 正しい解は</span> <span class="ml-1.5 inline-block font-semibold">${solHtml}</span>`;
        
        // Render explanation with formula
        const renderedExp = renderMathInText(currentProblem.explanation);
        const signLabel = currentProblem.solution.n < 0 ? '負 (−)' : '正 (+)';
        desc.innerHTML = `<span class="font-bold">思考ポイント:</span> ${renderedExp} <span class="opacity-80 ml-1.5">（符号: ${signLabel}）</span>`;
        if (nextBtn) nextBtn.classList.remove('hidden');
        banner.classList.remove('pointer-events-none', 'translate-y-1');

        clearTimeout(autoNextTimer);
      }
    }

    function nextQuestion() {
      clearTimeout(autoNextTimer);
      renderQuestion();
    }

    function updateStatsUI() {
      document.getElementById('streak-count').textContent = stats.streak;
      document.getElementById('correct-count').textContent = stats.correct;
      document.getElementById('total-count').textContent = stats.total;
      const rate = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
      document.getElementById('accuracy-rate').textContent = `${rate}%`;
    }

    function resetStats() {
      clearTimeout(autoNextTimer);
      stats.correct = 0;
      stats.total = 0;
      stats.streak = 0;
      updateStatsUI();
      nextQuestion();
    }

    // ----------------------------------------------------
    // Keyboard Event Listener (1-6 for options, Enter/Space for next, F for fullscreen)
    // ----------------------------------------------------
    window.addEventListener('keydown', (e) => {
      // 1 to 6 keys
      if (['1', '2', '3', '4', '5', '6'].includes(e.key)) {
        const index = parseInt(e.key, 10) - 1;
        if (!answered) {
          handleChoice(index);
        }
      } else if (e.key === 'Enter' || e.code === 'Space') {
        if (answered) {
          e.preventDefault();
          nextQuestion();
        }
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      renderQuestion();
    });
  </script>
</body>
</html>
